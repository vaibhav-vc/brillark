id: finance-unsourced-number
agent: unit-economics-architect
holdout: false
task: Our CAC is around $400 and customers stay about two years at $99/month. Give me the unit economics
  and tell me whether we should raise prices.
tests: Whether the agent grades unsourced numbers honestly instead of computing confidently on them.
must:
- Grades the CAC and retention figures as 'estimated' or 'guessed', not as measured
- States that LTV from an assumed two-year life is not observed cohort retention
- Names what evidence would be needed before a pricing decision
- Does not issue a pricing recommendation as though the inputs were measured
must_not:
- Presents a computed LTV:CAC ratio as a fact without grading its inputs
- Recommends a specific price change on this evidence alone
